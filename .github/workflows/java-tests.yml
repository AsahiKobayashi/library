name: Java Library Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify source URL comments
        run: |
          while IFS= read -r -d '' file; do
            expected="// Source: https://github.com/AsahiKobayashi/library/blob/main/${file}"
            actual="$(head -n 1 "$file")"
            if [ "$actual" != "$expected" ]; then
              echo "Incorrect source URL in $file"
              exit 1
            fi
          done < <(find monoid data-structures graph math string utils tests -name '*.java' -print0)
      - name: Compile all source files
        run: |
          mkdir -p out
          find monoid data-structures graph math string utils tests -name '*.java' -print0 | xargs -0 javac -d out
      - name: Test standard library
        run: java -cp out LibraryTest
      - name: Test lazy tree and monoid presets
        run: java -cp out LazySegTreeTest
      - name: Test Integer variants
        run: java -cp out IntegerLibraryTest
      - name: Test rolling hashes and lazy updates
        run: java -cp out RollingHashTest
      - name: Test LCS algorithms
        run: java -cp out LCSTest
      - name: Test BinaryTrie
        run: java -cp out BinaryTrieTest
      - name: Test AccessibleDeque
        run: java -cp out AccessibleDequeTest
      - name: Test Multiset and SortedMultiset
        run: java -cp out MultisetTest
      - name: Test ArraysUtil
        run: java -cp out ArraysUtilTest
